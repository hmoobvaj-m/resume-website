name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "10.34.9"
          run_install: false
          cache: false

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v24.22.3"
          test "$(pnpm --version)" = "10.34.9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint --max-warnings=0

      - name: Run security regression tests
        run: pnpm test

      - name: Build production application
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
        run: pnpm build

      - name: Verify static export
        run: |
          test -s out/index.html
          test -s out/resume.html || test -s out/resume/index.html
          test -s out/resume.pdf

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser regression tests
        run: pnpm test:e2e

      - name: Audit all dependencies
        run: pnpm audit

      - name: Audit production dependencies
        run: pnpm audit --prod